name: Keep Streamlit apps awake

# Streamlit Community Cloud puts an app to sleep after about 12 hours with no visitors.
# This opens each app in a headless browser every 6 hours so it never reaches that point.
# List the app links in the repository variable APP_URLS (comma separated).
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Visit the apps
        env:
          APP_URLS: ${{ vars.APP_URLS }}
        run: python .github/scripts/wake_streamlit.py
